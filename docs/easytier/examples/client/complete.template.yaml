# ============================================================================
# 完整独立版「EasyTier 内网接入」配置模板（直接给 fork mihomo / CVR 使用）
#
# 与短增量模板的区别：
#   - 这份是**完整配置**：mixed-port、TUN、DNS、proxies、groups、rules 全都在；
#   - 不依赖机场订阅；适合没有机场、只想接内网的人；
#   - 有机场的人仍建议用短模板，把本文件的内网段合并进机场 profile。
#
# 安全：<NET_SECRET> 是 overlay 入网资格。分享配置 = 分享入网资格；
#       对外分享前请另建一套 overlay + secret，或把 secret 留空让对方填。
# 依赖：必须使用本 fork 的 mihomo（上游会静默忽略 tun: true）。
# ============================================================================

mixed-port: 7897
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true

tun:
  enable: true                 # 需要 root/CAP_NET_ADMIN；CVR 服务模式会处理
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - "any:53"
  mtu: 1500

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    # A 类：公网域名→内网 IP，必须绕开 fake-ip，否则拿到 198.18.x.x
    - "+.<CORP_DOMAIN>"
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  nameserver-policy:
    # B 类：纯内网域名，经入口节点问内网 DNS
    "+.<CLUSTER_DOMAIN>":
      - "<DNS>#<LAN_NODE>"

proxies:
  - name: <LAN_NODE>
    type: easytier
    network-name: <NET_NAME>
    network-secret: <NET_SECRET>
    no-listener: true
    tun: false                 # 入口节点不要建自己的 TUN，否则会和出口争 overlay 路由
    udp: true
    # 必须是持有本机 LAN 地址、且不是 tun/utun/easytier* 的物理网卡
    interface-name: <PHYS_NIC>
    peers:
      - tcp://<RENDEZVOUS>:11010
    exit-nodes:
      - <EXIT_ADDR>

proxy-groups:
  - name: <GROUP>
    type: select
    proxies:
      - DIRECT
      - <LAN_NODE>

rules:
  # overlay 自身网段必须直连，交给 EasyTier 的设备/路由
  - IP-CIDR,<OVERLAY>,DIRECT,no-resolve
  # C 类：内网 CIDR 走入口节点
  - IP-CIDR,<HOME_CIDR>,<GROUP>
  - IP-CIDR,<CORP_CIDR>,<GROUP>
  # A 类：公网域名→内网 IP，按域名送进内网入口
  - DOMAIN-SUFFIX,<CORP_DOMAIN>,<GROUP>
  # B 类：纯内网域名，交给入口节点解析/转发
  - DOMAIN-SUFFIX,<CLUSTER_DOMAIN>,<LAN_NODE>
  # 其余按本机直连；有机场的人应把机场规则放在这些规则之前
  - MATCH,DIRECT
