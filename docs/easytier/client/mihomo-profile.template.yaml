# ============================================================================
# 「内网接入」订阅模板(可直接被 Clash Verge Rev 导入 ✓)
#   ★ 用法:复制成 my-profile.yaml,把全部占位符替换成你自己的值(或用同目录 render.sh ✓)
#   ★ 安全:本文件含 overlay 入网资格 ⇒ **分享 = 给出入网资格** ✗;对外分享请另建一套网络与 secret ✓
#   ★ 角色:这是一个**入口节点(不带 tun)** ✓ —— 与出口节点(带 tun)天然共存 ✓
#   ★ 内核:必须是**本 fork 构建**的 mihomo(easytier 出站是 fork 能力 ✓;上游会静默忽略 ✗)
# ============================================================================
proxies:
  # 入口节点:只负责"把内网目标送进 overlay",由家侧网关代拨/代转 ✓
  - name: <LAN_NODE, 入口节点名, 如 et-home>
    type: easytier
    network-name: <NET_NAME, overlay 网络名>
    network-secret: <NET_SECRET, overlay secret>
    no-listener: true                 # ✓ 不监听端口
    tun: false                        # ✓ 关键:不建设备 ⇒ 不抢 overlay /24 路由 ⇒ 与出口节点共存
    # ★ 必须显式绑**物理网卡** ✗ 不能留空:留空时内核按目标探测网卡, 而"到对端的路由"会被
    #   自家 overlay 设备接管 ⇒ 探测必然选中 overlay 自己 ⇒ 回环/不通 ✗(实测踩过 ✓)
    #   取值:持有本机 LAN 地址、且设备名不是 Meta/tun/utun/easytier* 的那块 ✓
    interface-name: <PHYS_NIC, 物理网卡名, 如 en0>
    # 不写静态 ipv4 ⇒ dhcp 自动取唯一地址 ✓(多台机器共用同一模板也不会撞地址)
    peers:
      - tcp://<RENDEZVOUS, 会合点地址>:11010
    # ★ 默认 TCP-only:办公/酒店/公共网络常封 UDP, 开着只会让打洞一直失败 ✗
    #   确认你的网络放行 UDP 后再改 true(能提升 P2P 成功率 ✓)
    udp: false
    exit-nodes:
      - <EXIT_ADDR, 家侧网关的 overlay 地址>      # 家侧"公告内网"的角色节点

proxy-groups:
  # 唯一的"自动"开关:现场选 DIRECT ✓ / 离网选入口节点 ✓
  - name: <GROUP, 内网分组名, 如 内网入口>
    type: select
    proxies:
      - DIRECT
      - <LAN_NODE, 入口节点名, 如 et-home>

rules:
  # overlay 自身网段必须直连(交给 easytier 自己的设备/路由 ✓)
  - IP-CIDR,<OVERLAY, overlay 网段, 如 10.144.0.0/24>,DIRECT,no-resolve
  # C 类:内网 CIDR ⇒ 全部进内网分组 ✓
  - IP-CIDR,<HOME_CIDR, 家侧内网网段, 如 192.168.1.0/24>,<GROUP, 内网分组名, 如 内网入口>
  - IP-CIDR,<CORP_CIDR, 公司内网网段, 如 10.0.0.0/8>,<GROUP, 内网分组名, 如 内网入口>
  # 域名分流:公网域名→内网 IP 的(split-horizon)与纯内网域名都要按**域名**分流 ✓
  # ⚠️ 作用域陷阱:DOMAIN-SUFFIX 会把**整个后缀**送进这个节点 ✗。
  #    若该后缀下也有**公网服务**(同域不同名很常见),它会被一起送进内网入口 ⇒ 超时 ✗
  #    (家侧转发拨号是直连,不经它自己的机场 ✓;而你在家侧用浏览器却能开 ⇒ 极易误判为"网络环路" ✗)
  #    ⇒ 该后缀若混有公网名字:删掉这条,改靠上面的 IP 规则 + fake-ip-filter 拿真实 IP 判定 ✓
  #    ⇒ 只有"确定整段都是内网名字"时才保留本行 ✓
  - DOMAIN-SUFFIX,<CORP_DOMAIN, 内网域名, 如 corp.example.com>,<GROUP, 内网分组名, 如 内网入口>
  - DOMAIN-SUFFIX,<CLUSTER_DOMAIN, 集群内域名, 如 cluster.local>,<LAN_NODE, 入口节点名, 如 et-home>
  # 其余走你自己的订阅规则(把本段拷进你现有 profile 时,这两条要放在它的规则之前 ✓)
  - MATCH,DIRECT

dns:
  enable: true
  # ★ A 类(公网域名→内网 IP):必须绕开 fake-ip,否则拿到 198.18.x.x ✗ 必失败 ✗
  fake-ip-filter:
    - "+.<CORP_DOMAIN, 内网域名, 如 corp.example.com>"
  nameserver-policy:
    # ★ B 类(纯内网域名):必须问内网 DNS,且经入口节点解析 ✓
    "+.<CLUSTER_DOMAIN, 集群内域名, 如 cluster.local>":
      - <DNS, 内网 DNS, 如 10.96.0.10>#<LAN_NODE, 入口节点名, 如 et-home>
