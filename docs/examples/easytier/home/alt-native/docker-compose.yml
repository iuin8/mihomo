# 家侧 overlay 节点（native EasyTier，零特权容器）—— 方案 B
#
#   docker compose -f docker-compose.yml up -d
#
# 它是什么：家侧**不跑 mihomo**，直接跑 EasyTier 官方原生内核（`easytier/easytier` 镜像）。
#   对客户端完全透明 —— 客户端仍是一个 easytier 出站 + 家里网段规则，用同一组 network-name/secret。
#
# 为什么这样配（实测结论）：
#   1) 家侧不需要任何特权：没有 TUN / root / cap_add / devices，也没有 iptables/MASQUERADE。
#      （历史上"家侧必须用原生内核"是因为**上游** mihomo 的 easytier 出站强制 no_tun，节点没有 L3 接口，
#        客户端经代理子网访问家里内网 TCP 不通、UDP 通；本 fork 的 TUN 模式——方案 A——已解决这一点。
#        所以现在两条路都可行，差别只在权限与性能，见下表。）
#   2) no_tun 下实测四条路径全通，20MB 传输 8.4 MB/s（方案 A 为 34.5–42.5 MB/s）。
#   3) EasyTier 自行转发并做 SNAT，所以不需要 ip_forward / iptables。
#   4) 默认 bridge 网络 + 端口映射即可，无需 host 网络。
#
#   | 对比项 | 方案 A（mihomo TUN，推荐）| 方案 B（本文件，native）|
#   | --- | --- | --- |
#   | 家侧权限 | NET_ADMIN + /dev/net/tun + ip_forward + MASQUERADE | 无（零特权 ✓）|
#   | 家侧内核 | 本 fork 构建（GHCR 镜像 ✓）| 官方 easytier 镜像 ✓ |
#   | TCP 吞吐 | 34.5–42.5 MB/s | 8.4 MB/s |
#   | ICMP（ping）| ✅ | ❌ |
#   | 家侧主动访问其他 overlay 节点 | ✅ | ❌ |
#
# 版本策略：**钉住 easytier 官方镜像的版本 tag**，不要用 latest。
#   升级流程：先在家侧机器 `docker compose pull` → 观察一次重启后的连通性 → 再提交改动。
#   当前钉 v2.6.4（多架构 amd64/arm64/arm/riscv64）。
#
# 端口说明：11010 只在"家侧有公网 IP / 能做端口映射"时才有意义；
#   家侧在 NAT 后面时两端都靠会合点中继，**可以不发布任何端口**（删掉整个 ports 段即可）。
#
# 健康检查说明：容器主进程就是 easytier-core（镜像 entrypoint 是 tini → easytier-core），
#   它退出容器即退出 → `restart: unless-stopped` 已经覆盖"进程挂了自动拉起"，
#   因此这里**不需要**额外的 healthcheck（多加一个只会引入误报）。
#
# 若将来需要 ICMP 或家侧主动访问其他 overlay 节点：
#   改为 host 网络 + cap_add: [NET_ADMIN] + devices: ["/dev/net/tun:/dev/net/tun"]，
#   并把 home-easytier-core.toml 的 no_tun 改成 false。

services:
  easytier:
    image: easytier/easytier:v2.6.4
    container_name: easytier
    restart: unless-stopped

    # 零特权容器：不允许进程通过 setuid/文件能力再提权
    security_opt:
      - no-new-privileges:true

    # 上限保护：家侧只做转发，实测 RSS 很低，512m 足够
    mem_limit: 512m

    ports:
      - "11010:11010/tcp"
      - "11010:11010/udp"

    volumes:
      - ./home-easytier-core.toml:/app/config.toml:ro

    # 镜像 entrypoint 为 `/sbin/tini -- easytier-core`，最终等价于：
    #   easytier-core -c /app/config.toml -n 192.168.1.0/24
    command:
      - "-c"
      - "/app/config.toml"
      - "-n"
      - "192.168.1.0/24"        # 改成你家里的内网网段（多个用逗号分隔）

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
