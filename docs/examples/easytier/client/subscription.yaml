# ═══════════════════════════════════════════════════════════════════════════
# EasyTier 客户端订阅（通用模板 ✓ 可直接分享给别人 ✓）
#
# 用法 ✓：把 <...> 占位符换成你自己的值 ✓（网络名/密钥/会合点/网段 ✓），
#         在 Clash Verge 里「导入 → 本地文件/URL」即可 ✓。
#
# ⚠️ 三条关键规则（都已在下面写好 ✓）：
#   ① 会合点必须 DIRECT ✗ —— 否则 underlay 被自己的 TUN 抓走 → overlay 永远建不起来 ✓
#      （这是实测踩到的根因：TUN 开着 + route-exclude 为空 → 本机节点从未进网 ✓）
#   ② overlay 网段也要 DIRECT ✗ —— 交给 easytier 自己的 TUN 处理 ✓，避免回环 ✓
#   ③ 家侧/集群网段指向对应出站 ✓ —— 这才是"按目标选出口"的地方 ✓
# ═══════════════════════════════════════════════════════════════════════════

mixed-port: 7897
mode: rule
log-level: info

dns:
  enable: true
  # 集群内域名走集群出站去问 CoreDNS ✓（不需要集群 DNS 的删掉这段 ✓）
  nameserver-policy:
    "+.cluster.local": ["<CoreDNS ClusterIP>#et-k8s"]
    "+.svc": ["<CoreDNS ClusterIP>#et-k8s"]

proxies:
  # ── 家侧（同时作为「出口节点」：家侧可以借本机出网 ✓）
  - name: et-home
    type: easytier
    network-name: "<网络名，如 private-overlay>"
    network-secret: "<强密钥，与家侧一致>"
    peers: ["tcp://<会合点>:11010"]
    udp: true
    mtu: 1380
    tun: true                          # ← 建宿主 TUN：让「家侧访问本机所在网段」成立 ✓（需 root ✓）
    ipv4: "<本机的 overlay 地址，如 10.144.0.6/24>"   # TUN 模式必填且全网唯一 ✗✓
    proxy-networks: ["<本机所在网段，如 192.168.0.0/24>"]  # ← 公告本机网段 ✓（家侧才找得到 ✓）
    enable-exit-node: true             # ← 让家侧能借本机出网 ✓
    exit-nodes: ["<家侧网关的 overlay 地址，如 10.144.0.2>"]  # 本机→家侧的非 overlay 目标落这里 ✓
    prewarm: true                      # ← 没有它实例不会被拉起 ✗✓（实测：overlay 里看不到本机 ✓）
    listeners: ["tcp://0.0.0.0:11010", "udp://0.0.0.0:11010"]

  # ── Kubernetes（只用来访问集群内部 ✓）
  - name: et-k8s
    type: easytier
    network-name: "<网络名>"
    network-secret: "<强密钥>"
    peers: ["tcp://<会合点>:11010"]
    udp: true
    mtu: 1380
    no-listener: true
    prewarm: true
    exit-nodes: ["<集群网关的 overlay 地址，如 10.144.0.30>"]

proxy-groups:
  - name: 🏠 家侧
    type: select
    proxies: [et-home, DIRECT]
  - name: ☸️ 集群
    type: select
    proxies: [et-k8s, DIRECT]

rules:
  # ①② 必须先于一切 ✗✓ —— 否则 TUN 会把 overlay 自己的流量抓回 mihomo ✓
  - IP-CIDR,<会合点 IP>/32,DIRECT,no-resolve
  - IP-CIDR,<overlay 网段，如 10.144.0.0/24>,DIRECT,no-resolve

  # ③ 按目标选出口 ✓
  - IP-CIDR,<家侧内网网段，如 10.0.0.0/24>,🏠 家侧
  - IP-CIDR,<集群 Service/Pod 网段>,☸️ 集群
  - DOMAIN-SUFFIX,cluster.local,☸️ 集群

  - MATCH,DIRECT
