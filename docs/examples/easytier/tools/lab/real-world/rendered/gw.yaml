# 家侧网关模板（结构取自生产 home.yaml ✓，值全部占位 ✓）
mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
proxies:
  # ① 家侧网关本体：公告家里网段 ✓，供"本机→家侧"使用 ✓
  - name: et-gateway
    type: easytier
    network-name: lab-overlay
    network-secret: lab-secret-please-change
    hostname: etlab-gw
    instance-name: etlab-gw
    ipv4: 10.144.0.2/24
    state-dir: /root/.config/mihomo/easytier
    listeners: ["tcp://0.0.0.0:11010", "udp://0.0.0.0:11010"]
    peers: ["tcp://rendezvous:11010"]
    enable-exit-node: true
    proxy-networks: ["10.99.1.0/24"]
    udp: true
    mtu: 1380
    tun: false
    prewarm: true
    tun-routes: []
  # ② 家侧访问"客户端所在网段"的拨号线 ✗✓ —— **只有它带 exit-nodes** ✓
  #    ⚠️ 规则必须指向它 ✗：指向 et-gateway 会落回本地（network is unreachable ✗）
  - name: et-to-client
    type: easytier
    network-name: lab-overlay
    network-secret: lab-secret-please-change
    hostname: etlab-gw-to-client
    no-listener: true
    peers: ["tcp://rendezvous:11010"]
    udp: true
    # 拨号线不需要自己的 TUN，也不需要 prewarm ✓（它只是家侧的出站 ✓）
    exit-nodes: ["10.144.0.6"]
rules:
  - IP-CIDR,10.99.1.0/24,DIRECT
  # ⭐ 必须早于任何 private/GEOIP 直连规则 ✗（该网段本身就是 RFC1918 ✓）
  - IP-CIDR,10.99.2.0/24,et-to-client,no-resolve
  - GEOIP,private,DIRECT,no-resolve
  - MATCH,DIRECT
