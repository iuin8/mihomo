# 家侧 mihomo（本 fork TUN 模式）容器 —— 推荐方案
#
#   docker compose -f docker-compose.tun.yml up -d
#   docker compose -f docker-compose.tun.yml logs -f --tail=50   # 期望：tun mode enabled on 10.144.0.2/24
#
# 三件硬性要求（实测缺一不可）：
#   1) NET_ADMIN + /dev/net/tun  —— 建 TUN 设备
#   2) net.ipv4.ip_forward=1     —— 家侧成为真路由器（容器内 /proc/sys 只读，必须用 sysctls 注入）
#   3) POSTROUTING MASQUERADE    —— 内网主机看到 overlay 源地址，回包需要 NAT 回来
#
# 镜像里的 mihomo 必须是**本 fork 构建**的（上游版本会拒绝 tun: true 之外的语义差异：
# 它强制 no_tun = true，不会建设备）。自行构建：go build -tags with_gvisor

services:
  mihomo:
    image: ghcr.io/iuin8/mihomo:alpha        # 或挂载自建二进制
    container_name: mihomo-home
    restart: unless-stopped

    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: 1

    ports:
      - "11010:11010/tcp"        # overlay 监听（用共享节点时可去掉）
      - "11010:11010/udp"
      - "7890:7890/tcp"          # mixed-port（按需暴露）

    volumes:
      - ./home-mihomo-tun.yaml:/root/.config/mihomo/config.yaml:ro
      - ./easytier-state:/root/.config/mihomo/easytier

    # NAT 需要在容器起来后执行一次（也可换成 entrypoint 包装）：
    #   docker exec mihomo-home sh -c \
    #     'apk add --no-cache iptables && iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE && iptables -P FORWARD ACCEPT'
    # 把 eth0 换成连接内网的那张网卡（多网卡时用 ip -o -4 addr show 确认）。

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
