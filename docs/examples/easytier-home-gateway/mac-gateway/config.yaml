# 家侧 overlay 网关（macOS 客户端，用户态）—— 与 CVR 解耦
# 说明见同目录 README.md；原理见 docs/easytier_home_gateway_sop.md 第 6 节。
mixed-port: 17899
bind-address: 127.0.0.1
allow-lan: false
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:19099
profile:
  store-selected: true
proxies:
  - name: et-home
    type: easytier
    network-name: home
    network-secret: "<与家侧一致>"
    hostname: mbp-gw
    instance-name: mbp-gw
    ipv4: 10.144.0.3/24
    no-listener: true
    peers: ["tcp://<会合点IP>:11010"]
    udp: true
    interface-name: en0
    # 不做 P2P 打洞：打洞的 STUN/UDP 在 TUN 环境里会被抓走，且中继模式更可控
    disable-p2p: true
rules:
  - MATCH,et-home          # 这个网关只服务 overlay，进来的流量一律送去家侧
