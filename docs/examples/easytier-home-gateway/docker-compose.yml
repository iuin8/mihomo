# 家侧网关（方案 A：mihomo TUN 模式）——— 一键启动
#
#   cd mihomo/docs/examples/easytier-home-gateway     # 需要本 fork 的完整仓库（要编译内核）
#   1) 编辑 home-mihomo-tun.yaml：network-secret / proxy-networks（家里网段）/ peers（会合点）
#   2) 多网卡时改下面的 NAT_INTERFACE（单网卡保持 eth0）
#   3) docker compose up -d                            # 首次会自动编译内核，之后秒起
#
# 需要家侧机器能出网拉取基础镜像；构建一次后镜像缓存在本机，重启用 restart: unless-stopped 自动拉起。
#
# 家侧没有公网 IP / 不能做端口映射时：不需要任何入站端口，两端都通过
# ../rendezvous/docker-compose.yml 里那台"共享节点"会合即可。

name: easytier-home-gateway

services:
  mihomo:
    build:
      context: ../../..                                  # mihomo 仓库根目录
      dockerfile: docs/examples/easytier-home-gateway/Dockerfile
    image: easytier-home-gateway:local
    container_name: mihomo-home
    restart: unless-stopped

    # 三件硬性要求之一：建 TUN 需要 NET_ADMIN + /dev/net/tun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

    # 三件硬性要求之二：容器内 /proc/sys 只读，转发开关只能在这里注入
    sysctls:
      net.ipv4.ip_forward: 1

    environment:
      # 三件硬性要求之三：MASQUERADE 由 entrypoint.sh 自动加在这张网卡上
      # 多网卡（docker network connect 了内网）时，用 `ip -o -4 addr show` 确认后改成 eth1 等
      NAT_INTERFACE: eth0

    volumes:
      - ./home-mihomo-tun.yaml:/root/.config/mihomo/config.yaml:ro
      - ./state:/root/.config/mihomo/easytier          # overlay 节点身份持久化，别删

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
