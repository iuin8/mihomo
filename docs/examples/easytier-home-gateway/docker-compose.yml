# 家侧网关（方案 A：mihomo TUN 模式）——— 直接用镜像，一键启动
#
#   1) 编辑 home-mihomo-tun.yaml：network-secret / proxy-networks（家里网段）/ peers（会合点）
#   2) 多网卡时不用改这里（镜像不做 NAT，见下）
#   3) docker compose up -d
#
# 默认从 GHCR 拉取已构建好的镜像（不需要仓库源码，也不需要本地 Go/编译）：
#   ghcr.io/iuin8/mihomo   ← 镜像就是纯 mihomo：没有入口脚本，行为全部来自挂载的 config
# 由 .github/workflows/easytier-home-gateway-image.yml 构建（多架构 amd64/arm64）。
#
# 想自己编译内核（改了代码、或拉不到 GHCR）时用构建覆盖文件：
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# 这里**没有** iptables/MASQUERADE，也不需要：实测 EasyTier（guest）在 TUN 模式下自己会 SNAT，
# 内网主机看到的是本机内网地址、回包正常（实验与判据见 SOP §6.13）。若你的内网拓扑特殊、
# 实测回包不通，再用 §6.13 里那段 compose 逃生口加一条 SNAT 即可。
#
# 家侧没有公网 IP / 不能做端口映射时：不需要任何入站端口，两端都通过
# ../rendezvous/docker-compose.yml 里那台"共享节点"会合即可。

name: easytier-home-gateway

services:
  mihomo:
    # 生产建议钉版本而不是 latest：GW_TAG=v1.19.32-fa.1001 docker compose up -d
    image: ghcr.io/iuin8/mihomo:${GW_TAG:-latest}
    container_name: mihomo-home
    restart: unless-stopped

    # 建 TUN 需要 NET_ADMIN + /dev/net/tun（网关模式唯一的两个硬性要求）
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

    # 容器内 /proc/sys 只读，路由器需要的转发开关只能在这里注入
    sysctls:
      net.ipv4.ip_forward: 1

    # 最小权限收敛：容器内不需要再提权
    security_opt:
      - no-new-privileges:true

    # 上限保护：实测稳态 ~200MB，1g 留足余量，同时避免异常时吃满宿主机内存
    mem_limit: 1g

    # 容器级健康检查（探内核 API）：内核挂了/挂死时这里报 unhealthy —— 只做"可见"，
    # 不自动重启（普通 compose 没有按健康状态重启的原语；要无人值守见 SOP §6.13 的 B 方案）。
    # 真的 unhealthy 时：docker compose restart mihomo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    volumes:
      - ./home-mihomo-tun.yaml:/root/.config/mihomo/config.yaml:ro
      - ./state:/root/.config/mihomo/easytier          # overlay 节点身份，别删

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
