# 家侧网关（方案 A：mihomo TUN 模式）——— 直接用镜像，一键启动
#
#   1) 编辑 home-mihomo-tun.yaml：network-secret / proxy-networks（家里网段）/ peers（会合点）
#   2) 多网卡时改下面的 NAT_INTERFACE（单网卡保持 eth0）
#   3) docker compose up -d
#
# 默认从 GHCR 拉取已构建好的镜像（不需要仓库源码，也不需要本地 Go/编译）：
#   ghcr.io/iuin8/mihomo
# 镜像由本仓库的 .github/workflows/easytier-home-gateway-image.yml 构建（多架构 amd64/arm64）。
#
# 想自己编译内核（改了代码、或拉不到 GHCR）时用构建覆盖文件：
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# 需要家侧机器能出网拉取镜像；镜像缓存在本机，重启用 restart: unless-stopped 自动拉起。
#
# 家侧没有公网 IP / 不能做端口映射时：不需要任何入站端口，两端都通过
# ../rendezvous/docker-compose.yml 里那台"共享节点"会合即可。

name: easytier-home-gateway

services:
  mihomo:
    # 生产建议钉版本而不是 latest：GW_TAG=v1.19.32-fa.1001 docker compose up -d
    image: ghcr.io/iuin8/mihomo:${GW_TAG:-latest}
    container_name: mihomo-home
    restart: unless-stopped

    # 三件硬性要求之一：建 TUN 需要 NET_ADMIN + /dev/net/tun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

    # 三件硬性要求之二：容器内 /proc/sys 只读，转发开关只能在这里注入
    sysctls:
      net.ipv4.ip_forward: 1

    # 硬性要求之外的最小权限收敛：容器内不需要再提权
    security_opt:
      - no-new-privileges:true

    # 上限保护：实测稳态 ~200MB，1g 留足余量，同时避免异常时吃满宿主机内存
    mem_limit: 1g

    environment:
      # 三件硬性要求之三：MASQUERADE 由 entrypoint.sh 自动加在这张网卡上
      # 多网卡（docker network connect 了内网）时，用 `ip -o -4 addr show` 确认后改成 eth1 等
      # 这个变量同时也是"进入网关模式"的开关（不传则按纯 mihomo 运行）
      NAT_INTERFACE: eth0

      # 存活看护：判据就是下面 healthcheck 用的同一个 API 探测。
      # 只有"整个内核挂死"它才动手：连续失败 LIVENESS_FAILS 次就 TERM 内核，交给 restart 策略重建。
      # 实例级的自愈不在这儿 —— 内核自己的监督循环（upstream #3215）秒级重建实例，带退避与日志。
      LIVENESS_INTERVAL: "30"          # 设 "0" 关闭存活看护
      LIVENESS_FAILS: "3"

    # 容器级健康检查（探内核 API）：内核挂了/挂死时这里报 unhealthy，
    # docker compose ps 与外部监控都能立刻看到（同一个信号也驱动上面的存活看护）
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    volumes:
      - ./home-mihomo-tun.yaml:/root/.config/mihomo/config.yaml:ro
      - ./state:/root/.config/mihomo/easytier          # overlay 节点身份 + 看门狗计数，别删

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
