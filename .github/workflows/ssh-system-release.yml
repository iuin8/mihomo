name: SSH System Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true

      - name: Set Variables
        id: vars
        run: |
          VERSION=${GITHUB_REF_NAME}
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "BUILDTIME=$(date -u)" >> $GITHUB_ENV
          echo "CGO_ENABLED=0" >> $GITHUB_ENV

      - name: Build Darwin AMD64 (v3)
        run: |
          GOARCH=amd64 GOOS=darwin GOAMD64=v3 go build -tags with_gvisor -trimpath -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=${{ env.VERSION }}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${{ env.BUILDTIME }}' -w -s -buildid=" -o bin/mihomo
          chmod +x bin/mihomo
          tar -czf bin/mihomo-darwin-amd64-v3-${{ env.VERSION }}.tar.gz -C bin mihomo
          rm bin/mihomo

      - name: Build Darwin ARM64
        run: |
          GOARCH=arm64 GOOS=darwin go build -tags with_gvisor -trimpath -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=${{ env.VERSION }}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${{ env.BUILDTIME }}' -w -s -buildid=" -o bin/mihomo
          chmod +x bin/mihomo
          tar -czf bin/mihomo-darwin-arm64-${{ env.VERSION }}.tar.gz -C bin mihomo
          rm bin/mihomo

      - name: Build Windows AMD64 (v3)
        run: |
          GOARCH=amd64 GOOS=windows GOAMD64=v3 go build -tags with_gvisor -trimpath -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=${{ env.VERSION }}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${{ env.BUILDTIME }}' -w -s -buildid=" -o bin/mihomo-windows-amd64-v3.exe
          zip -j bin/mihomo-windows-amd64-v3-${{ env.VERSION }}.zip bin/mihomo-windows-amd64-v3.exe

      - name: Build Windows ARM64
        run: |
          GOARCH=arm64 GOOS=windows go build -tags with_gvisor -trimpath -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=${{ env.VERSION }}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${{ env.BUILDTIME }}' -w -s -buildid=" -o bin/mihomo-windows-arm64.exe
          zip -j bin/mihomo-windows-arm64-${{ env.VERSION }}.zip bin/mihomo-windows-arm64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/*.tar.gz
            bin/*.zip
          name: ${{ env.VERSION }}
          draft: false
          prerelease: false
          body: |
            Mihomo with SSH system adapter enhancements.

            ## Downloads
            | Platform | Architecture | File |
            |----------|-------------|------|
            | macOS | amd64 (v3) | `mihomo-darwin-amd64-v3-${{ env.VERSION }}.tar.gz` |
            | macOS | arm64 | `mihomo-darwin-arm64-${{ env.VERSION }}.tar.gz` |
            | Windows | amd64 (v3) | `mihomo-windows-amd64-v3-${{ env.VERSION }}.zip` |
            | Windows | arm64 | `mihomo-windows-arm64-${{ env.VERSION }}.zip` |
