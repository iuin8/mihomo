name: SSH System Release

on:
  push:
    tags:
      - 'tag-fa-ssh_system-v*'

env:
  VERSION: ${{ github.ref_name }}
  CGO_ENABLED: 0

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
            amd64: v3
            name: mihomo-darwin-amd64-v3
            compress: tar
          - os: darwin
            arch: arm64
            name: mihomo-darwin-arm64
            compress: tar
          - os: windows
            arch: amd64
            amd64: v3
            name: mihomo-windows-amd64-v3
            compress: zip
          - os: windows
            arch: arm64
            name: mihomo-windows-arm64
            compress: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true

      - name: Set Variables
        run: |
          echo "BUILDTIME=$(date -u)" >> $GITHUB_ENV

      - name: Build
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            BIN_NAME="bin/${{ matrix.name }}.exe"
          else
            BIN_NAME="bin/mihomo"
          fi
          
          GOARCH=${{ matrix.arch }} GOOS=${{ matrix.os }} GOAMD64=${{ matrix.amd64 }} go build -tags with_gvisor -trimpath -ldflags "-X 'github.com/iuin8/mihomo/constant.Version=${{ env.VERSION }}' -X 'github.com/iuin8/mihomo/constant.BuildTime=${{ env.BUILDTIME }}' -w -s -buildid=" -o $BIN_NAME
          
          if [ "${{ matrix.compress }}" = "zip" ]; then
            zip -j bin/${{ matrix.name }}-${{ env.VERSION }}.zip $BIN_NAME
            rm $BIN_NAME
          else
            chmod +x $BIN_NAME
            tar -czf bin/${{ matrix.name }}-${{ env.VERSION }}.tar.gz -C bin mihomo
            rm $BIN_NAME
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: bin/*
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd bin
          sha256sum * > sha256sums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/*
          name: ${{ env.VERSION }}
          draft: false
          prerelease: false
          body: |
            Mihomo with SSH system adapter enhancements.

            ## Downloads
            | Platform | Architecture | File |
            |----------|-------------|------|
            | macOS | amd64 (v3) | `mihomo-darwin-amd64-v3-${{ env.VERSION }}.tar.gz` |
            | macOS | arm64 | `mihomo-darwin-arm64-${{ env.VERSION }}.tar.gz` |
            | Windows | amd64 (v3) | `mihomo-windows-amd64-v3-${{ env.VERSION }}.zip` |
            | Windows | arm64 | `mihomo-windows-arm64-${{ env.VERSION }}.zip` |

            ## Checksums
            A `sha256sums.txt` file is included for verification.
